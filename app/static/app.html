<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Application Details</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body>

    <main class="card">
        <p class="eyebrow">2nd Page</p>

        <h1>Application details</h1>

        <p id="student-information">
            Loading student...
        </p>
    


    <form id="application-form">

        <label for="company-name">
            Company name
        </label>

        <input
            id="company-name"
            type="text"
            placeholder="Acme Labs"
            required
        >


        <label for="job-role">
            Job role
        </label>

        <input
            id="job-role"
            type="text"
            placeholder="Backend Engineering Intern"
            required
        >
        


        <label for="recipient-email">
            Recipient email
        </label>

        <input
            id="recipient-email"
            type="email"
            placeholder="recruiter@example.com"
            required
        >




<div class="voice-input">
    <label for="transcript">Email Instructions</label>

    <textarea
        id="transcript"
        name="transcript"
        rows="4"
        placeholder="Describe the email you want to create..."
    ></textarea>

    <div class="voice-controls">
        <button
            type="button"
            id="speak-btn"
        >
            🎙 Speak
        </button>

        <span id="voice-status" role="status" aria-live="polite">
            Click Speak to start recording.
        </span>
    </div>
</div>
<button id="application-button" type="submit">
    Create application
</button>

<p id="application-status" role="status"></p>
    </form>
    </main>

    <script src="/static/tracker.js"></script>
    <script src="/static/app.js"></script>
    <script src="/static/voice.js"></script>

</body>

</html>
